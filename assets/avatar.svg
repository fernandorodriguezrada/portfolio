      <stop offset="0%" stop-color="#231F1C"/>
      <stop offset="100%" stop-color="#171514"/>
    </linearGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#DEB085" stop-opacity="0.22"/>
