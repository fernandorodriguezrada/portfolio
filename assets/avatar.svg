  <!-- Elegant Architect Monogram -->
  <text x="200" y="222" font-family="'Epilogue', 'Source Sans 3', sans-serif" font-size="96" font-weight="800" fill="#DEB085" text-anchor="middle" letter-spacing="-2">FR</text>
  <text x="200" y="270" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#AAA094" text-anchor="middle" letter-spacing="4">GUATIRE • VE</text>
